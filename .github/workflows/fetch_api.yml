name: Fetch Data from API
on:
 schedule:
 - cron: '0 0 * * *'
 workflow_dispatch: 
 jobs:
 fetch-and-store:
  runs-on: ubuntu-latest
  steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Set up Python
  uses: action/srtup-python@v5
  with:
   python-version: '3.11'
-name: Install dependencies
run: |
 pip install requests
-name: Run script to fetch API data
 run: python script.py
-name: Commit and push changes
run: |
 git confing --global user.name 'github-actions[bot]'
 git confing --global user.email 'github-actions[bot]@uers.noreply.github.com'
 git add .
 git diff --quiet && git diff --staged --quiet || (git commit -m "Update API data" && git push)
